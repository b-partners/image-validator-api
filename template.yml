AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Image Validator API

Parameters:
  Env:
    Type: String

Resources:
  ImageValidatorAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      # 1769 Mo = 1 vCPU complet : l'OCR est limite par le CPU (~5x plus rapide qu'a 512 Mo)
      MemorySize: 1769
      Timeout: 90
      FunctionUrlConfig:
        AuthType: NONE
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./main
      DockerTag: python3.12

Outputs:
  ImageValidatorAPIFunctionEndpoint:
    Description: "URL Endpoint"
    Value: !GetAtt ImageValidatorAPIFunctionUrl.FunctionUrl